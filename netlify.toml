# Dar Lin – configuration Netlify (hébergement gratuit, usage commercial autorisé)
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Paiement SumUp : /api/checkout et /api/status
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Les images et données sont à la racine du dépôt
[[redirects]]
  from = "/img/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/data/*"
  to = "/:splat"
  status = 200

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache"
