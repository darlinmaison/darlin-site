# Dar Lin – configuration Netlify
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# QR "Votre avis compte" de la carte merci (a remplacer par le lien d'avis Google)
[[redirects]]
  from = "/avis"
  to = "https://wa.me/33781055149?text=Bonjour%20Dar%20Lin%20%21%20Voici%20mon%20avis%20sur%20ma%20commande%20%3A%20"
  status = 302
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/img/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/data/*"
  to = "/:splat"
  status = 200

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache"
